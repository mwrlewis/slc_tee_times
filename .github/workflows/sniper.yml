name: Tee Time Sniper Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # This is server-code for "Every 5 Minutes"
  workflow_dispatch:       # This lets you click a "Run" button manually to test it

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the Bot
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PHONE_GATEWAY: ${{ secrets.PHONE_GATEWAY }}
        run: python alert_bot.py
