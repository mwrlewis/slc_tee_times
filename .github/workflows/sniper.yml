name: Tee Time Sniper Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install cloudscraper requests
        
      - name: Run the Bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alert_bot.py
