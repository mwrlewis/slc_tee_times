name: Tee Time Sniper Bot

on:
  # Allows cron-job.org to trigger the bot via the GitHub REST API
  workflow_dispatch: 
  repository_dispatch:
    types: [run-bot]

jobs:
  sweep:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper requests

      - name: Run Scraper Bot
        run: python alert_bot.py
        env:
          # Pulls the secure push notification key
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          
          # Pulls the live parameters controlled by your Streamlit app
          TARGET_DATE: ${{ vars.TARGET_DATE }}
          START_TIME: ${{ vars.START_TIME }}
          END_TIME: ${{ vars.END_TIME }}
          PARTY_SIZE: ${{ vars.PARTY_SIZE }}
